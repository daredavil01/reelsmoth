name: smoke

# Typecheck, validate timelines, and render the Demo composition (every base
# component, plus its soundtrack) as a 540p draft. Fails if anything throws,
# frame 0 is empty, or the mastered mix misses -14 LUFS / -1 dBTP.
on:
  push:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run catalog -- --check
      - run: scripts/master.sh Demo demo --draft
      # The draft carries the unmastered mix: master it, then check loudness and frame 0.
      - run: scripts/audio-master.sh videos/demo/draft.mp4 videos/demo/draft.mastered.mp4
      - run: scripts/check.sh videos/demo/draft.mastered.mp4
      - run: python3 scripts/find-drop.py videos/demo/draft.mastered.mp4
      - run: scripts/contact-sheet.sh videos/demo/draft.mp4 src/compositions/demo.timeline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-draft
          path: |
            videos/demo/draft.mp4
            videos/demo/contact-sheet.png
          if-no-files-found: ignore
